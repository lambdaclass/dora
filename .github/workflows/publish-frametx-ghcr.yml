name: Publish frame-tx Dora to GHCR

# Publishes the EIP-8141 frame-tx-aware Dora fork to
# ghcr.io/<owner>/dora:<branch> so it can be used in a kurtosis devnet via:
#   dora_params:
#     image: ghcr.io/lambdaclass/dora:frame-tx-view
on:
  push:
    branches:
      - frame-tx-view
      - frames-testnet
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Tag after the branch that built it: two branches publish here, and a
          # fixed tag would let one silently overwrite the other's image.
          tags: ghcr.io/${{ github.repository_owner }}/dora:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
